x-pointers-deliberately-absent:
  note: >-
    Recorded so a later pass does not "fix" these by adding a pointer. Each of the following was
    probed on 2026-08-13 and MISSED; the artifact documenting the absence exists, but no
    common[].type pointer is emitted, because the pointer would assert that the PROVIDER serves
    that surface.
  absent:
  - {type: WellKnown, reason: 'Every /.well-known/ path 404s on both API hosts and returns an HTML soft-404 shell on the portal host.', artifact: well-known/push-well-known.yml}
  - {type: SecurityTxt, reason: 'No security.txt served on any host.', artifact: well-known/push-well-known.yml}
  - {type: AgentCard, reason: '/.well-known/agent-card.json and /.well-known/agent.json 404 on both API hosts; the portal and marketing hosts answer 200 with HTML, which is not a card. No a2a/ artifact written.'}
  - {type: MCPServer, reason: 'No MCP server exists. mcp/push-mcp.yml carries deployment.mode = none and a CANDIDATE tool list derived by API Evangelist. Emitting MCPServer would credit an agent surface nobody ships.', artifact: mcp/push-mcp.yml}
  - {type: Idempotency, reason: 'No idempotency key, header or retry contract on any of the 67 operations.', artifact: conventions/push-conventions.yml}
  - {type: StatusPage, reason: 'No status page. status.cendyncrm.com does not resolve; status.cendyn.com 301s to a maintenance holding page.', artifact: lifecycle/push-lifecycle.yml}
  - {type: Deprecation, reason: 'No deprecation policy, no Sunset/Deprecation header support, no deprecated operations.', artifact: lifecycle/push-lifecycle.yml}
  - {type: Security, reason: 'No vulnerability disclosure policy, security.txt, bug bounty or security page found on any readable host.'}
  - {type: TrustCenter, reason: 'No trust centre found. trust.cendyn.com 301s to a maintenance holding page.'}
  - {type: Compliance, reason: 'No SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP claim published on any readable host. www.cendyn.com is behind a Cloudflare bot challenge and could not be read.'}
  - {type: ChangeLog, reason: 'No dated changelog or release notes anywhere on the developer portal.'}
  - {type: Pricing, reason: 'No pricing page. Sales-gated: Request Demo / Contact only.', artifact: plans/push-plans-pricing.yml}
  - {type: Roadmap, reason: 'No public roadmap.'}
  - {type: Postman, reason: 'No first-party Postman collection or workspace found.'}
  - {type: CLI, reason: 'No first-party CLI.'}
  - {type: Sandbox, reason: 'No sandbox, test mode, test credentials or magic test values documented.'}
