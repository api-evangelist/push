  description: >-
    Token-authenticated REST API for the Cendyn CRM (formerly PUSHTech) hospitality CRM / CDP
    platform. 67 operations across 15 resources: read the account credit balance, manage contacts
    and their custom fields, companies, products, purchases, coupon lists, hotel data and audience
    lists, read campaigns and preview a campaign message for one contact, send email, SMS and push
    deliveries and track their status, and bulk-ingest contacts and purchases through Sync Data.
