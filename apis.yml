aid: push
name: Push
description: >-
  Push (PUSHTech, now part of Cendyn) is a CRM, marketing automation, sales, and
  support platform focused on the hospitality, retail, ecommerce, and marketplace
  sectors, with deep specialization in hotel guest-journey automation used by more
  than 1,500 hotels. The platform unifies customer databases and orchestrates
  pre-stay, during-stay, and post-stay guest communications across email, SMS, and
  in-app / web push notification channels. Push exposes a token-authenticated REST
  API (Cendyn CRM API at api.eu.cendyncrm.com) for account, apps, campaign, delivery,
  contact, and activity data, an HMAC-signed webhooks surface for activity, delivery,
  and contact events, and a first-party JavaScript Web SDK for browser tracking and
  web push. Originally added to the API Evangelist network as a 500 Global portfolio
  lead, this profile has been enriched from the public developer portal.
