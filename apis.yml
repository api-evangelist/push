aid: push
name: Push
description: >-
  Push (PUSHTech, now operating as Cendyn CRM after its acquisition by Cendyn) is a CRM and
  customer data platform specialised in hospitality — the guest journey for hotels — with
  additional use in retail, ecommerce and marketplace. The platform unifies the guest database
  and orchestrates pre-stay, during-stay and post-stay communication across email, SMS and
  web/app push. Its token-authenticated REST API exposes 67 operations across 15 resources
  (contacts and contact custom fields, companies, products, purchases, coupon lists, hotel data,
  audience lists, campaigns, deliveries, account balance and a bulk sync-data ingest) from two
  independent data centers, api.eu.cendyncrm.com and api.us.cendyncrm.com. An HMAC-signed webhook
  surface publishes five event groups — activities, deliveries, contacts, bulk contacts and
  incoming SMS — and a first-party JavaScript Web SDK handles browser tracking and web push. The
  developer portal moved from developers.pushtech.com to developers.cendyncrm.com without a
  redirect; the old hostnames no longer resolve. Cendyn CRM publishes no OpenAPI, no AsyncAPI, no
  MCP server, no agent card and no /.well-known/ documents; the machine-readable artifacts in
  this repo are derived by API Evangelist from the provider's own published HTML reference.
