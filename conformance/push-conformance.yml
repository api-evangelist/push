api: Cendyn CRM (PUSHTech) REST API
note: >-
  Cross-cutting standards posture, derived from the derived OpenAPI, the developer portal, and
  live probes. Cendyn CRM publishes no conformance or certification claims of its own on the
  developer portal, so no `Compliance` pointer is emitted in apis.yml — every row below is our
  observation, not a provider assertion.
standards:
- id: openapi
  conforms: false
  evidence: >-
    The provider publishes no OpenAPI document. openapi/push-cendyn-crm-openapi.yml is DERIVED by
    API Evangelist from the provider's HTML reference and is not a provider artifact.
- id: rest
  conforms: partial
  evidence: >-
    Resource-oriented, account-scoped paths with conventional verb mapping (GET read, POST create,
    PUT update, DELETE delete). Two deviations: PUT /coupon_lists/redeem and
    PUT /hotel_data/{uuid}/add_language are RPC-style state transitions, and
    DELETE /purchases/delete_group is a bulk filter delete.
- id: oauth2
  conforms: false
  evidence: No OAuth2 securityScheme, no authorization or token endpoint, no scopes. Static bearer-style token only.
- id: oidc
  conforms: false
  evidence: /.well-known/openid-configuration returns 404 on both API hosts.
- id: rfc6750-bearer
  conforms: false
  evidence: >-
    Uses the Authorization header but with a non-standard `Token token=<secret>` scheme rather
    than `Bearer <token>`, and returns no WWW-Authenticate challenge on 401.
- id: rfc9457-problem-details
  conforms: false
  evidence: 'Errors are bare application/json {"error": "<string>"} — no type/title/status/detail, no application/problem+json media type.'
- id: rfc8594-sunset-header
  conforms: false
  evidence: No Sunset or Deprecation header; no deprecation policy published.
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 404 on both API hosts and an HTML shell on the portal host. See well-known/push-well-known.yml.
- id: rfc8615-well-known
  conforms: false
  evidence: No /.well-known/ document of any kind is served. See well-known/push-well-known.yml.
- id: rfc8615-agent-card
  conforms: false
  evidence: /.well-known/agent-card.json and /.well-known/agent.json return 404 on both API hosts. No a2a/ artifact is emitted.
- id: mcp
  conforms: false
