- id: webhooks
  conforms: true
  evidence: >-
    A real, documented webhook surface with five event groups, published payload field
    dictionaries, a signature verification contract and a retry schedule.
    https://developers.cendyncrm.com/api/webhooks
- id: hmac-webhook-signing
  conforms: true
  evidence: >-
    HMAC-SHA256 over the concatenation of timestamp and token, keyed with the account secret,
    compared against the Authorization header. Verification samples published in PHP, Python and
    Ruby.
- id: idempotency
  conforms: false
  evidence: No idempotency key, no idempotent-retry contract on any of the 67 documented operations.
- id: pagination
  conforms: false
  evidence: No page, cursor, offset or limit parameter on any of the documented list operations.
- id: rate-limit-headers
  conforms: false
  evidence: 'No X-RateLimit-*, RateLimit-* or Retry-After header observed on live responses from either data center.'
- id: request-id-tracing
  conforms: true
  evidence: 'x-request-id returned on live responses from both data centers (probed 2026-08-13). Undocumented, but present.'
- id: https-only
  conforms: true
