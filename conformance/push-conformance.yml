- id: data-residency
  conforms: true
  evidence: >-
    Two independent data centers with distinct base URLs (api.eu.cendyncrm.com,
    api.us.cendyncrm.com) selected per account. Relevant to EU data-residency obligations.
certifications_published: []
certifications_note: >-
  No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or CSA STAR claim is made anywhere on the developer
  portal or the PUSHTech site. The parent site www.cendyn.com is behind a Cloudflare bot challenge
  (HTTP 403 to every client tested) and could not be read, so the absence is confirmed only for
  the hosts that are readable.
