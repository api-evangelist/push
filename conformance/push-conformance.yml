- id: gdpr
  conforms: partial
  evidence: >-
    Not a certification claim. The API models GDPR as first-class data: the contact object carries
    gdpr_marketing_consent, gdpr_accept_terms, gdpr_date and gdpr_remote_ip, and the Web SDK
