docs: https://developers.cendyncrm.com/api/reference
api: Cendyn CRM (PUSHTech) REST API
note: >-
  Entity graph derived from the derived OpenAPI: one entity per reference resource group, with
  relationships read from id-reference fields in request bodies and query filters. The provider
  publishes no component schemas, so entity attributes below are the documented parameter names
  for each resource, and the objects are open — custom fields defined per account are sent as
  additional top-level members (see conventions/push-conventions.yml).
root:
  name: Account
  identifier: account_id
  note: >-
    Account is the tenancy root, not a manipulable resource — there is no create/update/delete
    for it. Every one of the 67 documented operations is scoped under
    /v{n}/account/{account_id}/, and account_id is a required path segment on all of them.
    The only Account operation is a balance read.
entities:
- name: Account
  operations: [currentBalanceAccount]
  identifier: account_id
  attributes: [balance, currency]
  note: Read-only balance; credits are consumed by deliveries and by contact email validation.
- name: Contact
  operations: [createContact, createBulkContact, getBulkContact, showContact, updateContact, listContact, deleteContact, emailValidationContact]
  identifier: _id
  alternate_keys: [user_id, device_id, email, phone, facebook_id, google_id, twitter_id]
  id_example: 550aac3da096734ce5000001
  note: >-
    The central entity of the platform. Carries identity, contact channels, GPS position, social
    identifiers, GDPR consent state and list subscriptions. user_id is the caller's own backend
    identifier and is the documented de-duplication key.
- name: ContactCustomField
  operations: [createContactCustomFields, updateContactCustomFields, listContactCustomFields, deleteContactCustomFields]
  identifier: custom_id
- name: Company
  operations: [createCompany, showCompany, updateCompany, listCompany, deleteCompany]
  identifier: company_id
- name: CompanyCustomField
  operations: [createCompanyCustomFields, updateCompanyCustomFields, listCompanyCustomFields, deleteCompanyCustomFields]
  identifier: custom_id
- name: Product
  operations: [createProduct, showProduct, updateProduct, listProduct, deleteProduct]
  identifier: UUID
  note: Products are keyed by a UUID path segment rather than the Mongo-style _id used by Contact.
- name: ProductCustomField
  operations: [createProductCustomFields, updateProductCustomFields, listProductCustomFields, deleteProductCustomFields]
  identifier: product_custom_id
  note: >-
    The reference names this path variable :product_custom_id on update and :custom_id on delete
    for the same resource. Normalised to product_custom_id in the OpenAPI; x-source-path on the
    affected operation records the published form.
- name: HotelData
  operations: [addLanguageHotelData, createHotelHotelData, deleteHotelData, listHotelData, removeLanguageHotelData, showHotelData]
  identifier: uuid
  note: >-
    The hospitality-specific entity — the reason this is a vertical CRM rather than a generic
    one. Carries per-language content, added and removed through dedicated operations.
- name: HotelDataCustomField
  operations: [createHotelDataCustomFields, updateHotelDataCustomFields, listHotelDataCustomFields, deleteHotelDataCustomFields]
  identifier: custom_id
- name: AudienceList
  operations: [createAudienceList, showAudienceList, updateAudienceList, listAudienceList, deleteAudienceList]
  identifier: id
  note: Segmentation container; contacts join and leave through list_subscriptions on the Contact object.
- name: Campaign
  operations: [showCampaigns, listCampaigns, previewMessageCampaigns]
  identifier: campaign_id
  note: >-
    Read-only over the API. Campaigns are authored in the Cendyn CRM manager UI; the API can list,
    show and render a per-contact message preview but cannot create or send one.
- name: Coupon
  operations: [createCouponLists, showCouponLists, updateCouponLists, listCouponLists, deleteCouponLists, redeemCouponLists]
  identifier: coupon_list_id
  note: Redeem is a state transition (PUT /coupon_lists/redeem) rather than a resource write.
- name: Purchase
  operations: [createPurchase, updatePurchase, listPurchase, deletePurchase, deleteGroupPurchase]
  identifier: purchase_id
  note: >-
    The e-commerce fact table. Created under a contact, then addressed at account level for
    update and delete. deleteGroupPurchase is a bulk delete by filter.
- name: Delivery
  operations: [sendEmailDeliveries, sendPushDeliveries, sendSMSDeliveries, showDeliveries, listDeliveries]
  identifier: delivery_id
  note: >-
    A single outbound message on one of three channels. Deliveries are the only operations that
    consume account balance, and they are the operations with no idempotency contract.
- name: SyncData
  operations: [createSyncData, showSyncData]
  identifier: id
  note: >-
    Bulk composite ingest — accepts contacts[] and purchase[] in one payload. The only resource
    published WITHOUT a /v2 version prefix.
