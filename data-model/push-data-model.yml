entities_referenced_but_not_exposed:
- name: App
  referenced_by: [sendPushDeliveries, listDeliveries]
  via: app_id
  note: >-
    Push deliveries and delivery filters take an app_id, and the Web SDK is constructed with an
    app_id / app_secret pair, but the REST reference publishes NO app resource — apps can only be
    created and read in the manager UI. A real surface gap for an agent that needs to discover
    which app to send to.
- name: Device
  referenced_by: [createContact, listDeliveries]
  via: device_id
  note: >-
    device_id is settable on a contact and filterable on deliveries, but there is no device
    resource. Devices are registered by the mobile/Web SDKs, not by the REST API.
- name: Template
  referenced_by: [webhook delivery events]
  via: 'template[_id]'
  note: >-
    Delivery webhook payloads carry template[_id] and template[name], but no template resource is
    published in the REST reference. See asyncapi/push-webhooks.yml.
