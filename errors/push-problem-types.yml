gaps:
- >-
  The developer portal publishes NO error reference page. The reference tables for all 67
  operations document only the success status; no 4xx or 5xx response is documented for any
  operation. Every non-2xx entry above was established by probing, not by reading the docs.
- >-
  No validation-error shape is published. The delivery-send and contact-create operations accept
  30+ body members with stated constraints ("Boolean type", "ISO_8601 format", "ISO-2 format",
  "MALE or FEMALE") but the response for violating one of them is undocumented.
- >-
  No rate-limit or quota-exhaustion error is documented, even though deliveries and contact email
  validation consume account balance (see currentBalanceAccount). The behaviour when balance
  reaches zero is unpublished.
webhook_delivery_errors:
  note: >-
    The webhooks documentation defines the inverse contract — the status codes the PROVIDER reads
    from the SUBSCRIBER. Captured here because it is the only documented status-code semantics on
    the whole surface.
  codes:
  - {status: 200, meaning: Success. The POST is considered delivered and is not retried.}
  - {status: 406, meaning: Rejected. The POST is considered refused and is not retried.}
  - {status: other, meaning: 'Retried on a fixed schedule for 4 hours: 5m, 5m, 10m, 10m, 30m, 1h, 2h. Delivery-channel events are never retried.'}
  source: https://developers.cendyncrm.com/api/webhooks
