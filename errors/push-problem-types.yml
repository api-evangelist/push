problems:
- status: 401
  title: Authorization failure
  observed: true
  example: '{"error":"authorization failure for account: 000000000000000000000000"}'
  cause: >-
    Missing, malformed or invalid Authorization header, or an account secret that does not match
    the account_id in the path.
  remediation: >-
    Send `Authorization: Token token={account_secret}`. Confirm the account lives in the data
    center you are calling — an EU account secret will fail against api.us.cendyncrm.com and vice
    versa. Some operations require the account master secret instead.
  www_authenticate: absent
