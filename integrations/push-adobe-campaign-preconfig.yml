arazzo: 1.0.1
info:
  title: 'push through adobe-campaign: createService preconfigured with push'
  summary: Calls adobe-campaign's createService with `push` preset, the way push is used inside adobe-campaign.
  description: 'A PRECONFIGURATION, not an orchestration: push is a rail inside adobe-campaign, so the integration
    is adobe-campaign''s own operation with push''s enum value set. Derived from adobe-campaign''s contract (adobe-campaign-profileandservices-api-openapi.yml);
    required properties are inputs.'
  version: 1.0.0
x-integration:
  partner: adobe-campaign
  relationship: rail
  preconfig: true
  edge_evidence: https://github.com/api-evangelist/adobe-campaign/blob/main/openapi/adobe-campaign-profileandservices-api-openapi.yml
  edge_type: contract
  preset:
    messageType: push
  method: derived
  generated: '2026-10-12'
  generator: build-integration-preconfigs.py
sourceDescriptions:
- name: adobeCampaignProfileandservicesApiOpenapi
  url: https://raw.githubusercontent.com/api-evangelist/adobe-campaign/refs/heads/main/openapi/adobe-campaign-profileandservices-api-openapi.yml
  type: openapi
workflows:
- workflowId: push-via-adobe-campaign-createservice
  summary: createService with push preset
  inputs:
    type: object
    required:
    - label
    properties:
      label:
        type: string
  steps:
  - stepId: call-with-preset
    operationId: $sourceDescriptions.adobeCampaignProfileandservicesApiOpenapi.createService
    requestBody:
      contentType: application/json
      payload:
        label: $inputs.label
        messageType: push
    successCriteria:
