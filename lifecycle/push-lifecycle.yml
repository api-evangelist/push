platform_lifecycle:
  event: rebrand-after-acquisition
  observed: '2026-08-13'
  detail: >-
    PUSHTech was acquired by Cendyn and the product is now Cendyn CRM. The lifecycle consequence
    is visible in DNS: developers.pushtech.com, help.pushtech.com and the old portal hosts no
    longer resolve (NXDOMAIN), and the developer portal moved to developers.cendyncrm.com. The
    move was executed without a redirect — the retired hostnames were simply removed, so every
    inbound link, bookmark and integration doc pointing at developers.pushtech.com is dead. The
    API host's own 404 body is the only breadcrumb to the new location.
  evidence:
  - {url: 'http://developers.pushtech.com/api', status: 0, note: DNS NXDOMAIN}
  - {url: 'http://help.pushtech.com', status: 0, note: DNS NXDOMAIN}
  - {url: 'https://api.eu.cendyncrm.com/openapi.json', status: 404, note: 'body: {"error":"Route not found, please visit https://developers.cendyncrm.com/api/reference"}'}
  - {url: 'https://developers.cendyncrm.com/api/reference', status: 200}
