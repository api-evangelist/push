tool_design_note: >-
  A candidate MCP surface for this API would need to solve two problems the REST API does not
  solve for itself. First, every operation is scoped to an account_id path segment that the agent
  must be told; it is not derivable from the token. Second, three operations SEND MESSAGES to real
  people and draw down a prepaid balance (sendEmailDeliveries, sendPushDeliveries,
  sendSMSDeliveries) with no idempotency contract, so a retried tool call sends a duplicate
  message. Those three are marked consequence: physical below and should require confirmation.
tools:
