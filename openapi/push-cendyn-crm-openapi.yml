  /v2/account/{account_id}/email/deliveries:
    post:
      operationId: sendEmailDeliveries
      summary: Send Email — Deliveries
      tags:
      - Deliveries
      externalDocs:
        description: Cendyn CRM API reference
        url: https://developers.cendyncrm.com/api/docs/deliveries/send_email
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
        description: Your account unique identifier to access the API. This parameter is part of the authorization
          process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sender:
                  description: Parameter containing the name of who sent the message.
                sender_email:
                  description: Parameter containing the email of who sent the message.
                subject_holder:
                  description: 'Parameter containing the subject of the message. This message can have
                    interpolation''s containers inserted as %{name_of_variable}. Example: "Hi, good morning
                    %{name}".'
                message_holder:
                  description: 'Parameter containing the content of the message. This message can have
                    interpolation''s containers inserted as %{name_of_variable}. Example: "Hi, good morning
                    %{name}".'
                deliveries:
                  description: 'Parameter containing an array of hashes. those hashes contains two key-value
                    elements, email and replacements. The email value contains the destination of the
                    email. The replacements contains a hash with the values of the interpolation''s containers.
                    Example: [{ email: "[email protected]", replacements: {"name": "John"} }]'
                start_now:
                  description: Parameter to schedule the deliveries with the date provided with the parameter
                    start_at
                start_at:
                  description: Time when to send the email
              required:
              - sender
              - sender_email
              - subject_holder
              - message_holder
              - deliveries
              - start_now
            example:
              sender: John Doe
              sender_email: '[email protected]'
              subject_holder: Hello %{name}
              message_holder: <html><h1>Hey! This is a test %{name} %{surname}</h1></html>
              start_now: true
              deliveries:
              - email: '[email protected]'
                replacements:
                  name: Jane
                  surname: Doe
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                deliveries:
                - valid: true
                  delivery_id: 550ab6a1a096734ce5000002
        '401':
          description: 'Unauthorized — missing or invalid `Authorization: Token token=...` header.'
  /v2/account/{account_id}/push/deliveries:
    post:
      operationId: sendPushDeliveries
      summary: Send Push — Deliveries
      tags:
      - Deliveries
      externalDocs:
        description: Cendyn CRM API reference
        url: https://developers.cendyncrm.com/api/docs/deliveries/send_push
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
        description: Your account unique identifier to access the API. This parameter is part of the authorization
          process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_id:
                  description: Your app unique identifier to access the API. This parameter is part of
                    the authorization process
                subject:
                  description: Title of the push notification that will appear in the notification bar
                    of the user's device.
                message_holder:
                  description: 'parameter containing the content of the message. this message can have
                    interpolation''s containers inserted as %{name_of_variable}. Example: "Hi, good morning
                    %{name}".'
                deliveries:
                  description: 'Parameter containing an array of hashes. those hashes contains two key-value
                    elements, device_id and replacements . The device_id, user_id or contact_id that send
                    the delivery. The replacements contains a hash with the values of the interpolation''s
                    containers. Example: [{ device_id: "550ab6a1a096734ce5000002", replacements: {"name":
                    "Your Name"} }]'
                start_now:
                  description: Parameter to schedule the deliveries with the date provided with the parameter
                    start_at
                send_all_devices:
                  type: boolean
                  description: If true, send all contact's devices, else send the last contact's device.
                    Only available when use 'user_id' or 'contact_id'
                start_at:
                  type: string
                  format: date-time
                  description: Parameter containing the date when the deliveries will be send. the date
                    has to been formated following the ISO 8601. If the date introduced is before from
                    now your deliveries will be send instantly
                alert:
                  description: Parameter to set the title of the push notification. If it is blank, then
                    we will send a silent push notification. (Only iOS)
                sound:
                  description: Parameter to specify the file sound to play when a push notification is
                    received. (Only iOS)
                url:
                  description: Parameter to specify rich content in the push notification
                thumbnail_url:
                  description: To send a big picture notification
                category_push:
                  description: 'Interactive Notifications with Notification Actions, only the following
                    strings are accepted: ''CATEGORY_OK'', ''CATEGORY_EDIT'', ''CATEGORY_FIND'', ''CATEGORY_LIKE_DISLIKE'',
                    ''CATEGORY_LAUNCH'', ''CATEGORY_REMIND'', ''CATEGORY_DELETE'', ''CATEGORY_FORBID'',
                    ''CATEGORY_LIKE_FOLLOW'', ''CATEGORY_LIKE_SHARE'', ''CATEGORY_SHARE'', ''CATEGORY_SHOP'',
                    ''CATEGORY_YES'', ''CATEGORY_ACCEPT'', ''CATEGORY_SEND'', ''CATEGORY_BUY'', ''CATEGORY_SAVE'''
                badge:
                  description: iOS only. The number to display as the badge of the app icon. If this property
                    is absent, the badge is not changed. To remove the badge, set the value of this property
                    to 0.
                silent:
                  description: 'iOS only. If true, means that when your app is launched in the background
                    or resumed, application:didReceiveRemoteNotification:fetchCompletionHandler: is called.'
                extra:
                  description: Parameter to specify custom content that will be shown on delivery
              required:
              - app_id
              - subject
              - message_holder
              - deliveries
              - start_now
            example:
              app_id: '{{app_id}}'
              subject: PushMsg
              send_all_devices: true
              url: https://www.cendyncrm.com
              thumbnail_url: https://www.cendyncrm.com/assets/logo-light-daf5fc9918db1e811190d12aea30947d.png
              category_push: CATEGORY_FIND
              message_holder: Hello %{name}, this is a Push Notification
              start_now: 'true'
              alert: Hi %{name}
              silent: false
              deliveries:
              - device_id: '{{device_id}}'
                replacements:
                  name: John
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                deliveries:
                - - valid: true
                    delivery_id: 550ab6a1a096734ce5000002
                    device_id: 5834114ff92ea112ad000001
                  - valid: true
                    delivery_id: 550ab6a1a096734ce5000003
                    device_id: 5834167ff92ea112ad304059
        '401':
          description: 'Unauthorized — missing or invalid `Authorization: Token token=...` header.'
  /v2/account/{account_id}/sms/deliveries:
    post:
      operationId: sendSMSDeliveries
      summary: Send SMS — Deliveries
      tags:
      - Deliveries
      externalDocs:
        description: Cendyn CRM API reference
        url: https://developers.cendyncrm.com/api/docs/deliveries/send_sms
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
        description: Your account unique identifier to access the API. This parameter is part of the authorization
          process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sender:
                  description: MAX 11 characters. Parameter containing the name of who sent the message.
                message_holder:
                  description: 'Parameter containing the content of the message. this message can have
                    interpolation''s containers inserted as %{name_of_variable}. Example: "Hi, good morning
                    %{name}"'
                deliveries:
                  description: 'Parameter containing an array of hashes. those hashes contains key-value
                    elements as phone number and replacements. Example: [{phone_number: "+447712345678",
                    replacements: {"name": "Your name"}}]'
                deliveries[phone_number]:
                  description: The phone number value has to be formated following the standart E164.
                deliveries[replacements]:
                  description: The replacements contains a hash with the values of the interpolation's
                    containers
                deliveries[multiple]:
                  type: boolean
                  description: if true send multiple sms items for unicode message or long messages.By
                    default set to false.
                start_now:
                  description: Parameter to schedule the deliveries with the date provided with the parameter
                    start_at.
                start_at:
                  type: string
                  format: date-time
                  description: Parameter containing the date when the deliveries will be send. the date
                    has to been formated following the ISO 8601. If the date introduced is before from
                    now your deliveries will be send instantly.
              required:
              - sender
              - message_holder
              - deliveries
              - deliveries[phone_number]
              - deliveries[replacements]
              - start_now
            example:
              sender: CocaCola
              message_holder: Hello %{name}, how are you?
              start_now: true
              deliveries:
              - phone_number: '+447712345678'
                replacements:
                  name: John
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              example:
                deliveries:
                - valid: true
                  delivery_id: 550ab6a1a096734ce5000002
        '401':
          description: 'Unauthorized — missing or invalid `Authorization: Token token=...` header.'
