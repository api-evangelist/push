packages:
- name: PUSHTECH Web SDK
  official: true
  language: javascript
  registry: cdn
  version: 2.9.0
  published: '2024-06-26'
  published_source: 'Last-Modified header on the pinned CDN asset (probed 2026-08-13, HTTP 200, 30,250 bytes)'
  url: https://assets-cdn.pushtech.com/sdk/web/2.0/PUSHTECHWebSDK.2.9.0.min.js
  install: '<script src="https://assets-cdn.pushtech.com/sdk/web/2.0/PUSHTECHWebSDK.2.9.0.min.js" type="text/javascript"></script>'
  pinned: true
  entry_point: 'new PUSHTechSDK(app_id, app_secret, user_id)'
  auth: app_id + app_secret (per-app credentials, distinct from the REST account secret)
  description: >-
    First-party JavaScript library that integrates Cendyn CRM (PUSHTech) into web applications:
    initialize a user session, create per-user metrics (geolocation, birthdate, country, city,
    name, language, gender, email, phone, login/logout, user id, list subscribe/unsubscribe, GDPR
    consent, e-commerce events), manage web push notifications via a service worker, and transmit
    collected metrics with sendMetrics(). Options setOptions({enable_geolocation, enable_heartbeat})
    are set before init().
  note: >-
    Distributed by <script> tag from the vendor CDN only — there is no npm, PyPI, Maven, NuGet,
    Go, RubyGems, Packagist or crates.io package for it, so there is no registry metadata endpoint
    to query. The version above is read from the pinned filename and the publication date from the
    asset's Last-Modified header. That date is the strongest currency signal available for this
    provider: the SDK build is over two years old, and it still carries the retired PUSHTech brand
    in both its class name and its CDN hostname while the platform, the portal and the API host
    have all been rebranded to Cendyn CRM.
- name: PUSHTECH Web SDK service worker
  official: true
  language: javascript
  registry: cdn
  version: 1.0.0
  published: '2019-12-16'
  published_source: 'Last-Modified header on the pinned CDN asset (probed 2026-08-13, HTTP 200, 958 bytes)'
  url: https://assets-cdn.pushtech.com/sdk/web/sw/1.0/sw.1.0.0.min.js
  install: "Create pushtech-sw.js in the web root containing: importScripts('https://assets-cdn.pushtech.com/sdk/web/sw/1.0/sw.1.0.0.min.js');"
  pinned: true
  description: >-
    Service worker that backs web push notification delivery for the Web SDK. The file MUST be
    named pushtech-sw.js and MUST sit at the root of the site or web push will not work.
  note: >-
    Companion to the Web SDK, not independently useful. Last modified 2019-12-16 — over six years
    old.
